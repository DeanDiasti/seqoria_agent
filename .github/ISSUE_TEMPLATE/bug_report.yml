name: Bug report
description: Report a reproducible problem in the supported library.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private URLs, personal data, or real conversation histories.
        For suspected vulnerabilities, follow SECURITY.md and request a private route without posting details.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Package version, Python version, operating system, provider, and MCP transport if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Small code sample using synthetic data, plus steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized traceback or logs
      description: Remove credentials, endpoint query values, prompts, and user data before submitting.
