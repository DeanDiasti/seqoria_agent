name: Feature proposal
description: Discuss a change to the supported library.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Application problem
      description: Describe the workload and limitation using synthetic examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Explain API implications, ownership, multi-user isolation, and alternatives considered.
    validations:
      required: true
