name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install only the built core wheel
        run: python -m pip install dist/*.whl
      - name: Import outside the source checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from seqoria_agent import AsyncAIClient, LocalToolbox, SeqoriaMCP; from seqoria_agent.providers import AsyncOpenAIProvider, AsyncAnthropicProvider, AsyncOllamaProvider; import importlib.util; assert importlib.util.find_spec('mlx_vlm') is None; assert importlib.util.find_spec('seqoria_agent.memory') is None"
