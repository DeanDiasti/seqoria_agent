[project]
name = "seqoria-agent"
version = "0.6.1"
description = "Seqoria Agentic Assistant Framework - MCP-native tool orchestration for AI applications"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Dean Diasti"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Core dependencies - minimal footprint
dependencies = [
    "httpx[http2]>=0.28.1",
    "mcp[cli]>=1.25.0",
    "pydantic>=2.12.5",
    "structlog>=25.5.0",
]

[project.urls]
Homepage = "https://github.com/deandiasti/seqoria_agent"
Documentation = "https://deandiasti.github.io/seqoria_agent/"
Repository = "https://github.com/deandiasti/seqoria_agent"

[project.optional-dependencies]
# LLM Provider extras - install only what you need

# Caching backends
redis = ["redis>=7.1.0"]

# Performance optimizations (recommended)
performance = [
    "orjson>=3.9.0",
    "xxhash>=3.6.0",
]

# FastAPI server support
server = ["fastapi>=0.128.0"]

# Memory store adapters (canonical + vector)
memory-mongo = ["pymongo"]
memory-postgres = ["psycopg[binary]"]
memory-pgvector = [
    "psycopg[binary]",
    "pgvector",
]
memory-qdrant = ["qdrant-client"]
memory = [
    "pymongo",
    "psycopg[binary]",
    "pgvector",
    "qdrant-client",
]


# Full installation with all features
all = [
    "redis>=7.1.0",
    "orjson>=3.9.0",
    "xxhash>=3.6.0",
    "fastapi>=0.128.0",
    "pymongo",
    "psycopg[binary]",
    "pgvector",
    "qdrant-client",
]

# Development dependencies
dev = [
    "build>=1.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.1",
    "redis>=7.1.0",
    "orjson>=3.9.0",
    "xxhash>=3.6.0",
    "fastapi>=0.128.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.18",
    "mkdocstrings[python]>=0.25.1",
    "pymdown-extensions>=10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "D", "B"]
ignore = [
    "D401", "ANN101", "ANN001", "D205", "D212",  
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D202", "D407", "D406", "D204",
    "E501", "I001",
    "B904", "N814", "F541", "E402", "N806"
]

[tool.ruff.pydocstyle]
convention = "numpy"

[tool.ruff.isort]
known-first-party = ["seqoria_agent"]
