[project]
name = "seqoria-agent"
version = "0.9.1"
description = "Seqoria Agentic Assistant Framework - MCP-native tool orchestration for AI applications"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Dean Diasti"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Core dependencies - minimal footprint
dependencies = [
    "httpx[http2]>=0.28.1,<1",
    "mcp>=1.30.0,<2",
    "pydantic>=2.12.5,<3",
]

[project.urls]
Homepage = "https://github.com/deandiasti/seqoria_agent"
Documentation = "https://deandiasti.github.io/seqoria_agent/"
Repository = "https://github.com/deandiasti/seqoria_agent"

[project.optional-dependencies]
# Performance optimizations (recommended)
performance = [
    "orjson>=3.9.0",
    "xxhash>=3.6.0",
]

# FastAPI server support
server = ["fastapi>=0.128.0"]

# All runtime extras
all = [
    "orjson>=3.9.0",
    "xxhash>=3.6.0",
    "fastapi>=0.128.0",
]

# Development dependencies
dev = [
    "build>=1.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.17.1,<0.18",
    "mypy>=2.4,<3",
    "twine>=6.0.0",
    "orjson>=3.9.0",
    "xxhash>=3.6.0",
    "fastapi>=0.128.0",
]

docs = [
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.18",
    "mkdocstrings[python]>=0.25.1",
    "pymdown-extensions>=10.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "B"]
ignore = [
    "D401", "D205", "D212",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D202", "D407", "D406", "D204",
    "E501",
    "B904", "N814", "E402", "N806"
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["seqoria_agent"]

[tool.hatch.build.targets.wheel]
packages = ["seqoria_agent"]

[tool.hatch.build.targets.sdist]
include = ["/seqoria_agent", "/tests", "/docs", "/examples", "/mkdocs.yml", "/README.md", "/CHANGELOG.md", "/LICENSE.txt", "/pyproject.toml", "/pytest.ini", "/RELEASING.md", "/CONTRIBUTING.md", "/SECURITY.md", "/SUPPORT.md", "/CODE_OF_CONDUCT.md", "/benchmarks", "/scripts"]
exclude = ["**/.plan_mode_artifacts/**"]

[tool.mypy]
python_version = "3.12"
files = ["seqoria_agent"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["seqoria_agent"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
