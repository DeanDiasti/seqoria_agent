[project]
name = "seqoria-agent"
version = "0.3.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Dean Diasti"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "anthropic>=0.57.1",
    "fastapi>=0.115.14",
    "httpx>=0.28.1",
    "openai>=1.93.0",
    "pydantic>=2.11.7",
    "redis>=6.2.0",
    "structlog>=25.4.0",
    "PyJWT>=2.8.0",
    "xxhash>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/deandiasti/seqoria_agent"
Documentation = "https://deandiasti.github.io/seqoria_agent/"
Repository = "https://github.com/deandiasti/seqoria_agent"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.1",
    "pytest-cov>=5.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.18",
    "mkdocstrings[python]>=0.25.1",
    "pymdown-extensions>=10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "D", "B"]
ignore = [
    "D401", "ANN101", "ANN001", "D205", "D212",  
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D202", "D407", "D406", "D204",
    "E501", "I001",
    "B904", "N814", "F541", "E402", "N806"
]

[tool.ruff.pydocstyle]
convention = "numpy"

[tool.ruff.isort]
known-first-party = ["seqoria_agent"]
