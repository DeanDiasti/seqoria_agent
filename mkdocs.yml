site_name: Seqoria Agent
site_url: https://deandiasti.github.io/seqoria_agent/
repo_url: https://github.com/DeanDiasti/seqoria_agent
site_description: Async MCP tool orchestration for Python web applications.
theme:
  name: material
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            show_docstring_parameters: false
            show_docstring_returns: false
            show_docstring_raises: false
markdown_extensions:
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Web applications: topics/multi_tenancy.md
  - Tool execution: guides/ai_client.md
  - MCP servers: servers.md
  - Caching: topics/caching.md
  - Release review: release-review.md
  - API reference:
      - Client: reference/client.md
      - Server: reference/server.md
      - Models: reference/models.md
      - Providers: reference/providers.md
