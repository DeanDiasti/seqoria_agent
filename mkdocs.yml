site_name: Seqoria Agent
site_url: https://deandiasti.github.io/seqoria_agent/
repo_url: https://github.com/DeanDiasti/seqoria_agent
site_description: Async MCP tool orchestration for Python web applications.
theme:
  name: material
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            show_docstring_parameters: false
            show_docstring_returns: false
            show_docstring_raises: false
markdown_extensions:
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true
nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Guides:
      - Tool execution: guides/tool-execution.md
      - Web applications: guides/web-applications.md
      - MCP connections: guides/mcp.md
      - Migration: migration.md
  - API reference:
      - Client and parameters: reference/client.md
      - Local tools: reference/toolbox.md
      - MCP transports: reference/mcp.md
      - Message models: reference/models.md
      - Providers: reference/providers.md
  - Maintainers:
      - Release review: maintainers/release-review.md
      - Public alpha review: maintainers/public-alpha.md
