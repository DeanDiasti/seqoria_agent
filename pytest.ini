[pytest]
addopts = --cov=seqoria_agent.client.ai_client --cov-report=term-missing --cov-fail-under=90 -q -m "not slow"
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

[coverage:run]
omit =
    */seqoria_agent/client/ai_client/base.py
    */seqoria_agent/client/ai_client/executor.py
    */seqoria_agent/client/ai_client/tool_registry.py
    */seqoria_agent/client/ai_client/llm_interface.py
    */seqoria_agent/client/ai_client/connection_pool.py 